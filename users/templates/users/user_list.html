<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
  </head>
  <body>
    <header>
      <div>
        <div>
          <a href="{% url "index" %}">Головна</a>
        </div>
        <div>
            <a href="">Профіль</a>
            <form action="" method="post" style="display: inline;">
              {% csrf_token %}
              <button type="submit" class="btn-link" style="padding: 0; border: none; background: none;">Вийти</button>
            </form>
            <a href="">Увійти</a>
            <a href="">Зареєструватись</a>
        </div>
      </div>
    </header>

    <main>
        <h2>Всі викладачі які існують на платформі</h2>
      <section>
        {% for user in object_list %}
          <div>
            <a href="{% url "users:author_detail" pk=user.id %}">{{ user.username }}</a>
          </div>
        {% empty %}
          <p>Користувачів не знайдено.</p>
        {% endfor %}
      </section>
    </main>

    <footer>

    </footer>
  </body>
</html>
